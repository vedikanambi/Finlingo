  # 2026-07-22 (second pass): the first corpus expansion (UCC 2-718/2-719,
  # GDPR 6/28) was topically correct but too small in scale (~11 of 3,851
  # chunks) to move retrieval recall. This second batch adds real, larger
  # sources chosen to match FLB's 6 risk categories at the specific
  # sub-topics CUAD's commercial clauses actually raise: financial-sector
  # data sharing (GLBA/Reg P, not generic UK/EU privacy law), auto-renewal
  # in subscription/negative-option contexts (FTC Telemarketing Sales Rule
  # negative-option provisions), unfair/deceptive practices doctrine that
  # applies broadly across Hidden Fee/Liability Waiver/Penalty Clause (FTC
  # Act Sec. 5), unconscionability doctrine for liability waivers (UCC
  # 2-302), and the underlying Truth in Lending Act finance-charge statute
  # behind CFPB Reg Z (Hidden Fee).
  - source: Regulation P - Privacy of Consumer Financial Information (12 CFR 1016)
    jurisdiction: US
    url: https://www.ecfr.gov/api/versioner/v1/full/2026-07-09/title-12.xml?part=1016
