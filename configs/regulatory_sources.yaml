version: "1.1"
# 2026-07-22: added local cache_path pins for every source. A live evaluation
# run this date found the corpus fetched inconsistently at request time (e.g.
# EU Consumer Credit Directive returned 0 usable chunks, FTC Negative Option
# Rule only 4), which cascades into large swings in S5's evidence-citation
# gate and RQ3 recall between nominally-identical runs -- a real
# reproducibility bug, not just noise. Pinning removes that source of
# variance. EU Consumer Credit Directive 2023/2225 is removed below (not just
# disabled: the "enabled" field is not read anywhere in the loading code, so
# leaving a dead entry would still attempt and fail the fetch every run):
# eur-lex.europa.eu now serves an AWS WAF JS bot-challenge to non-browser
# clients on every endpoint tried (root PDF, OJ HTML, legislative-summary
# HTML), so it cannot be fetched at all, live or cached -- a genuine,
# disclosed dead source, silently contributing ~0 chunks in prior runs too.
