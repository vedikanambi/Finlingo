  # 2026-07-22 (third pass): retrieval-recall root cause was NOT primarily a
  # retrieval-method problem (see in_memory_retriever.py's BM25/hybrid switch
  # and config.py's top_k/top_j/query-mode changes) -- a cheap retrieval-only
  # probe (scripts/probe_retrieval_recall.py) showed even a much wider BM25
  # search plateaus without genuinely on-topic source text. CUAD's clauses are
  # general COMMERCIAL contracts (consulting agreements, licensing, M&A), not
  # consumer lending -- so the domain-appropriate regulatory grounding is
  # general contract-law doctrine on the exact CUAD clause categories
  # (auto-renewal, indemnification/liability caps, liquidated
  # damages/penalties, data-sharing disclosure), not banking-specific rules.
  # This batch adds real, statute-level sources for exactly those categories,
  # fetched via scripts/fetch_new_regulatory_sources.py (California's
  # automatic-renewal law, anti-indemnity statute, liquidated-damages statute,
  # CCPA consumer-data-sharing provisions, Delaware's corporate
  # indemnification statute, and additional UCC default/remedies sections).
